<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ComicCraft</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="container"><div class="hero"><h1>🐉 ComicCraft</h1><p>AI Comic Storyteller — Dragon School</p></div><form action="/generate" method="post" class="card" id="comicForm"><label>Story prompt</label><textarea name="story_prompt" required>{{ defaults.story_prompt }}</textarea><label>Main character</label><input name="character" value="{{ defaults.character }}"><label>Setting</label><input name="setting" value="{{ defaults.setting }}"><label>Tone</label><input name="tone" value="{{ defaults.tone }}"><label>Art style</label><input name="art_style" value="{{ defaults.art_style }}"><button type="submit" id="submitBtn">✨ Create My 5-Panel Comic</button></form></main><script src="/static/script.js"></script></body></html>
