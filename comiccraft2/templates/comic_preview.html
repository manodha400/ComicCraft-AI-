<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your Comic</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="container"><div class="hero"><h1>🐉 Your Dragon School Comic</h1><p>5-panel story preview</p><a class="download" href="/download/{{ pdf }}">📄 Download PDF</a></div>{% for p in layout %}<section class="panel card"><h2>Panel {{ p.panel }} — {{ p.title }}</h2><img src="/{{ p.image }}" alt="Panel {{ p.panel }}"><h3>{{ p.caption }}</h3><p>{{ p.narration }}</p><p class="dialogue">{{ p.dialogue }}</p></section>{% endfor %}<a href="/" class="back">← Create another comic</a></main></body></html>
